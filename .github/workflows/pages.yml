name: Deploy frontend
on:
  push:
    branches: [main]
    paths: ['jarvis-frontend/**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: cp jarvis-frontend/nova-chat.html jarvis-frontend/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: jarvis-frontend }
      - id: d
        uses: actions/deploy-pages@v4